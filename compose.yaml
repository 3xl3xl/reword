name: reword
services:
  reword:
    build: .
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      DATABASE_PATH: /app/data/reword.db
      OAUTH_ISSUER: ${OAUTH_ISSUER:?Set OAUTH_ISSUER}
      OAUTH_RESOURCE_URL: https://${REWORD_DOMAIN:?Set REWORD_DOMAIN}/mcp
      OAUTH_JWKS_URL: ${OAUTH_JWKS_URL:?Set OAUTH_JWKS_URL}
      ALLOWED_HOSTS: ${REWORD_DOMAIN},${REWORD_DOMAIN}:443,127.0.0.1:3000
    volumes:
      - reword-data:/app/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    stop_grace_period: 15s
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      REWORD_DOMAIN: ${REWORD_DOMAIN:?Set REWORD_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      reword:
        condition: service_healthy
volumes:
  reword-data:
  caddy-data:
  caddy-config:
